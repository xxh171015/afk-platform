version: 1
setup: pnpm install --frozen-lockfile && scripts/pg-temp.sh start
commands:
  - name: typecheck
    run: pnpm typecheck
    timeoutSeconds: 300
  - name: test
    run: eval "$(scripts/pg-temp.sh start)" && pnpm test
    timeoutSeconds: 600
    junit: reports/junit.xml
  - name: lint
    run: pnpm lint
    timeoutSeconds: 120
