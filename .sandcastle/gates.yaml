version: 1
# The worker runs each command as `timeout <seconds> <run>`, so anything that is not a
# single executable (`&&`, `eval`) must be wrapped in `bash -c`.
# install-deps.sh tries the registries in AFK_NPM_REGISTRIES in order. A failed setup is retried as a job, not
# handed to gate-fix.
setup: bash -c 'scripts/install-deps.sh && scripts/pg-temp.sh start'
commands:
  - name: typecheck
    run: pnpm typecheck
    timeoutSeconds: 300
  - name: test
    run: bash -c 'eval "$(scripts/pg-temp.sh start)" && pnpm test'
    timeoutSeconds: 600
    junit: reports/junit.xml
    # $0 is the dummy name bash -c requires; filenames are appended as $1… so "$@" is the failed files.
    rerunFiles:
      - bash
      - -c
      - eval "$(scripts/pg-temp.sh start)" && pnpm test -- "$@"
      - pnpm
  - name: lint
    run: pnpm lint
    timeoutSeconds: 120
generated:
  - paths:
      - packages/shared/src/api/openapi.json
      - packages/shared/src/api/schema.d.ts
    run: pnpm gen:api
  - paths:
      - packages/api/drizzle/*.sql
      - packages/api/drizzle/meta/**
    run: scripts/rebase-migrations.sh
