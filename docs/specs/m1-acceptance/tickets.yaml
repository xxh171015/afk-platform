# M1 验收需求：订单备注（试点仓库 afk-pilot-backend）
# 用 `plat tickets import <S-xx> tickets.yaml` 导入。格式见 docs/design.md「plat CLI 与票的导入」。
# 有意覆盖：已批准的保护路径、契约 SHA、依赖链、模块重叠告警（票 4 与票 2/3/5、票 3 与票 5）、并行。
spec: S-M1-ACCEPT
tickets:
  - key: contract
    repo: backend
    type: contract
    title: 契约：订单备注字段和修改备注接口
    modules: ["openapi/**"]
    protected_paths_ok: ["openapi/openapi.yaml"]
    acceptance:
      - openapi.yaml 的 Order 和 NewOrder 里有可选字符串字段 note，最长 200 个字符
      - openapi.yaml 里有 PATCH /orders/{id}，请求体是 { note }，成功返回更新后的订单，订单不存在返回 404，note 超长返回 400
      - 现有接口的描述不变
    body: |
      只改契约，不改代码。note 缺省时表示没有备注（响应里该字段可以不出现）。

  - key: note-field
    repo: backend
    type: implementation
    title: 订单增加备注字段
    modules: ["src/orders/**", "test/**"]
    blocked_by: [contract]
    acceptance:
      - POST /orders 接受可选的 note（字符串，去掉首尾空白，最长 200），超长返回 400，错误信息是 "note must be at most 200 characters"
      - 订单响应在有备注时包含 note，没有时不出现该字段
      - GET /orders 和 GET /orders/:id 返回的订单都带上 note
      - 每条验收标准都有对应的 HTTP 测试，已有测试不减少、不跳过
    body: |
      按契约实现，不要修改契约文件。

  - key: patch-note
    repo: backend
    type: implementation
    title: 修改订单备注
    modules: ["src/orders/**", "test/**"]
    blocked_by: [contract, note-field]
    contract: contract
    acceptance:
      - PATCH /orders/:id 请求体 { "note": "..." }，成功返回 200 和更新后的订单
      - note 为空字符串时清除备注（响应里不再有 note）
      - 订单不存在返回 404，note 不是字符串或超长返回 400
      - 已取消（cancelled）的订单不允许修改备注，返回 409，错误信息是 "cannot edit a cancelled order"
      - 每条验收标准都有对应的 HTTP 测试
    body: |
      按契约（契约 SHA 上的版本）实现。

  - key: filter-customer
    repo: backend
    type: implementation
    title: 按客户过滤订单列表
    modules: ["src/orders/**", "test/**"]
    acceptance:
      - GET /orders?customer=alice 只返回 customer 精确等于 alice 的订单（区分大小写），顺序仍按创建顺序
      - 可以和 status 过滤同时使用，两个条件取交集
      - customer 为空字符串时返回 400，错误信息是 "customer must not be empty"
      - 不带 customer 时行为不变
      - 每条验收标准都有对应的 HTTP 测试
    body: |
      在已有的订单列表接口上加一个可选查询参数。不改契约文件（契约的同步由单独的契约票处理）。

  - key: stats-by-status
    repo: backend
    type: implementation
    title: 统计里增加按状态分组
    modules: ["src/orders/**", "test/**"]
    blocked_by: [note-field]
    acceptance:
      - GET /orders/stats 的响应里增加 byStatus，格式是 { pending, paid, shipped, cancelled }，每项是 { count, total }
      - 原有的 count、total、totalFormatted 保持不变（仍然不含已取消订单）
      - 没有订单时 byStatus 里每一项都是 { count: 0, total: 0 }
      - 每条验收标准都有对应的 HTTP 测试
    body: |
      不改契约文件。

external_blocked_by: []
